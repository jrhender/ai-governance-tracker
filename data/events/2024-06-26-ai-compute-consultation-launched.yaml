title: "ISED launches public consultation on AI computing infrastructure"
date: 2024-06-26
status: completed

organizations:
  - id: ised-canada
    role: organizer

description: >
  François-Philippe Champagne, Minister of Innovation, Science and Industry,
  opens a public consultation on how Canada should spend the $2 billion
  Budget 2024 set aside for AI compute — seeking input from researchers,
  innovators, businesses, civil society, and Indigenous groups on the design
  of both the AI Compute Access Fund and a Canadian Sovereign AI Compute
  Strategy. The consultation closes on 6 September 2024, drawing input from
  more than 1,000 stakeholders, and shapes the strategy announced that
  December.


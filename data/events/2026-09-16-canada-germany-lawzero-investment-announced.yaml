description: >
  At the ALL IN conference in Montréal, Minister Evan Solomon and Germany's
  Minister Karsten Wildberger announce plans to invest CAD 150 million and EUR
  100 million respectively in LawZero, the Montréal non-profit founded by
  Yoshua Bengio. Canada's funding, through the Strategic Response Fund,
  supports research talent and computing capacity for LawZero's safe-by-design
  Scientist AI methodology, creating 360 jobs and sovereign compute with
  Hypertec and 5C. Germany's share, subject to European Commission
  notification, funds a new German office. The investment builds on the
  Canada-Germany AI Joint Declaration and Sovereign Technology Alliance.


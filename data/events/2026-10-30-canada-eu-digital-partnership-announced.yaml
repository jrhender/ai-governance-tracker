description: >
  During the Canada–EU Summit in Montréal (October 29–30), Minister Evan
  Solomon and Henna Virkkunen, the European Commission's Executive
  Vice-President for Tech Sovereignty, Security and Democracy, were scheduled
  to announce a new partnership to strengthen Canada–EU digital cooperation.
  ISED's media advisory gives no detail of what the partnership covers. On the
  summit's margins, Canada and the EU also concluded negotiations on a
  separate digital trade agreement.


description: >
  During his visit to Shenzhen, Prime Minister Mark Carney meets Chinese
  President Xi Jinping. According to the Prime Minister's Office readout, the
  two leaders agree on the importance of strengthening cooperation on the
  global governance of artificial intelligence, recognising both its
  transformative potential and the need to address its risks. They emphasise
  the urgency of working together to promote the safe and responsible
  development and use of AI, including through greater international
  cooperation and dialogue.


# mitigations/national-ai-resilience.yaml

id: national-ai-resilience
schema_type: DefinedTerm
title: "Build domestic resilience to AI-driven shocks"
description: >
  Implement domestic measures against secondary impacts of AI crises:
  AI-powered cyberattacks on critical infrastructure, supply chain
  disruptions, fiscal shocks from sustained job losses, and loss of access
  to foreign compute.
mitigation_type: operational-process
addresses_risks:
  - ai-enabled-cyberattacks
  - labour-market-disruption
  - ai-power-concentration-dependence
status: under_review
implemented_by:
  - artifact: canadian-sovereign-ai-compute-strategy
    relationship: partially_implements
    note: >
      Domestic, Canadian-governed compute reduces exposure to loss of access
      to foreign compute, one of the shocks this mitigation names. It does not
      address cyber, supply-chain or fiscal shocks.
  - artifact: responsible-data-centre-development-principles
    relationship: related
    note: >
      The principles ask data centres handling sensitive data or critical
      systems to meet Canadian protection, cybersecurity and access
      requirements. Voluntary.
tags: [resilience, critical-infrastructure]

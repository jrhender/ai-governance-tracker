description: >
  "AI for All" is Canada's renewed national AI strategy, launched by Prime
  Minister Mark Carney in Toronto on 4 June 2026 and led by Innovation,
  Science and Economic Development Canada (ISED) under Evan Solomon, Minister
  of Artificial Intelligence and Digital Innovation. It is the successor
  national framework that emerged from the 30-day AI Sprint and AI Strategy
  Task Force engagement of late 2025 and the February 2026 summary of inputs.
  It is distinct from — and runs alongside — the 2017 Pan-Canadian AI
  Strategy, the CIFAR-administered research-and-talent funding program that
  remains in its Phase 2 (2021–2031).

  The strategy is anchored in three fundamental priorities: building public
  trust, creating new opportunities, and reinforcing Canadian sovereignty.
  Beneath these, ISED organizes the strategy into six pillars: protecting
  Canadians and safeguarding democracy; empowering Canadians; powering AI
  adoption for shared prosperity; building a sovereign AI foundation; scaling
  Canadian champions; and building trusted partnerships.

  It is backed by roughly $2 billion in new federal investment over five
  years. Headline measures include a national public AI supercomputer and
  sovereign compute and cloud infrastructure; an expanded Canadian AI Safety
  Institute to conduct transparent evaluations of AI models (with $50 million
  in funding); a National AI Literacy Initiative reaching one million
  entry-level post-secondary students and training more than 3,000 educators;
  an AI Missions Program led by a flagship health mission ($200 million); a
  $500 million Canadian Tech Growth Fund to scale domestic AI companies; a
  $100 million Health Sector Data Space; and a Sovereign Technology Alliance
  of international partners. The government projects the strategy could unlock
  nearly $200 billion in economic growth over five years, create 250,000 new
  AI-related jobs, deliver 90,000 AI-related job placements for young
  Canadians, and raise business AI adoption from roughly 12% to 60% by 2034.


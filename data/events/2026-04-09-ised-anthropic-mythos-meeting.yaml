title: "Minister Solomon and ISED meet Anthropic over the Claude Mythos model"
date: 2026-04-09
status: completed

organizations:
  - id: ised-canada
    role: participant

description: >
  After Anthropic withheld its new Claude Mythos model from general release —
  citing its ability to detect and exploit software vulnerabilities, offering
  instead a preview to select critical infrastructure operators under a program
  dubbed "Project Glasswing" — the Canadian government engages the company.
  ISED officials meet Anthropic on April 8, and Minister of Artificial
  Intelligence and Digital Innovation Evan Solomon does so on April 9, 2026.
  Solomon calls Anthropic's "defenders first" approach the responsible path and
  the discussions constructive and ongoing. Canada later joins Project
  Glasswing through the Canadian Centre for Cybersecurity.


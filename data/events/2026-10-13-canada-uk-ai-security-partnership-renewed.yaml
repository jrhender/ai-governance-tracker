description: >
  During a visit to London, Minister Evan Solomon renews Canada's AI security
  partnership with the United Kingdom, deepening the agreement first signed in
  2024. It recommits the Canadian AI Safety Institute and the UK AI Security
  Institute to cooperate, and sets three priorities: interoperable AI security
  standards, information-sharing, and technical cooperation on frontier AI
  risks and evaluation. The ISED release names no new signed document or
  funding.


description: >
  On the margins of the ALL IN conference in Montréal, where Germany is the
  2026 Country of Honour, Minister Evan Solomon and Germany's Minister Karsten
  Wildberger hold the first co-chairs' meeting of the Sovereign Technology
  Alliance, launched in Munich in February 2026. In a joint statement issued
  the next day, the ministers describe the meeting as a milestone in
  operationalizing the alliance as a platform for Canada, Germany and trusted
  partners to strengthen sovereign AI capabilities. They took stock of
  interest from prospective members and agreed to work towards a launch with
  founding members in the coming months.


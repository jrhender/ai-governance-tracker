# mitigations/build-public-ai-literacy.yaml

id: build-public-ai-literacy
schema_type: DefinedTerm
title: "Build public AI literacy"
description: >
  Teach students, educators and the public how AI systems work and fail, so
  people can judge AI outputs, spot manipulation and avoid over-reliance.
mitigation_type: governance-oversight
addresses_risks:
  - erosion-of-human-autonomy
  - ai-influence-operations
status: adopted
implemented_by:
  - event: national-ai-literacy-initiative-launched-2026
    relationship: implements
    note: >
      A $13-million partnership with Amii delivers free courses for students,
      educators and the public, targeting up to one million post-secondary
      students.
tags: [ai-literacy, education]

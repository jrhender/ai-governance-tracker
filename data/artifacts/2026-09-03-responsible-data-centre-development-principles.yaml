summary: "ISED's voluntary national framework setting five expectations for data centre projects — local benefits, no electricity costs shifted to Canadians, minimal water and environmental impact, transparency, and strategic value to Canada. 42 signatories."
description: |
  **Canada's Responsible Data Centre Development Principles** are a voluntary
  national framework published by Innovation, Science and Economic
  Development Canada and launched in Toronto on 3 September 2026 by Evan
  Solomon, Minister of Artificial Intelligence and Digital Innovation,
  alongside Federation of Canadian Municipalities President Tim Tierney.
  Industry signatories commit to building data centres in line with five
  expectations:

  1. **Create lasting local benefits** — jobs, training, local and Indigenous
     procurement, tax contributions, and compute access for host communities
     and Indigenous rights holders, identified through early engagement.
  2. **Do not shift electricity costs to Canadians** — proponents pay the
     generation, transmission, and grid-upgrade costs attributable to their
     projects and must not compromise grid reliability.
  3. **Minimize water use and environmental impacts** — protect local water
     supplies, prefer closed-loop cooling, waste-heat recovery, and
     low-emission energy, and report impacts using recognized standards.
  4. **Be transparent about local impacts** — engage early with local
     governments and Indigenous communities, respect local approvals, and
     provide independently verifiable information on power, water, sound,
     and emissions, tracked over time.
  5. **Bring strategic value to Canada** — investment, Canadian supply-chain
     participation, research partnerships, and digital resilience; facilities
     handling sensitive data or critical systems must meet Canadian legal
     protection, cybersecurity, and access requirements.

  The principles are intended to complement, not replace, provincial,
  territorial, municipal, and Indigenous regulatory processes by giving
  communities a nationally recognized baseline for assessing proposals. They
  support the sovereign-AI pillar of **AI for All**, Canada's national AI
  strategy, and the **Canadian Sovereign AI Compute Strategy**. There is no
  enforcement mechanism beyond the signatories' public commitment.


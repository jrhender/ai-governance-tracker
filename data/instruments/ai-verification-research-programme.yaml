id: ai-verification-research-programme
schema_type: DefinedTerm
title: "Public AI verification research programme and testbeds"
description: >
  A government-backed programme that builds and stress-tests verification
  technology before any agreement needs it: a dedicated team at the national
  AI safety institute, grant rounds, joint verification experiments with
  industry and other governments, and red-teaming on national compute such as
  public data centres and supercomputers. Proposed for the UK; no Canadian
  equivalent is tracked yet.

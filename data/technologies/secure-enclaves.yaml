id: secure-enclaves
schema_type: DefinedTerm
title: "Secure enclaves"
also_known_as: ["Trusted Execution Environments (TEEs)"]
domain: verification
summary: >
  Hardware that cryptographically reports the code and model being executed.
  TEEs are already used in some AI clusters but are not yet suitable for
  international coordination; brought up to standard, they could help verify
  some rules.
example_claim: "X amount of FLOPs were used in this training run."
why_it_matters: >
  Could strengthen claims that a pacing rule is being followed in real time
  and with more granularity.
links:

# mitigations/ai-incident-monitoring.yaml

id: ai-incident-monitoring
schema_type: DefinedTerm
title: "Strengthen AI incident monitoring and emergency protocols"
description: >
  Strengthen national and international AI incident monitoring and build
  protocols for coordinated emergency response.
mitigation_type: operational-process
addresses_risks:
  - loss-of-control
  - unreliable-ai-agents
status: under_review
implemented_by:
  - event: ised-ai-transparency-consultation-launched-2026
    relationship: related
    note: >
      ISED's 2026 AI transparency consultation (23 July to 23 September 2026)
      asks for views on tracking serious AI incidents. Outcome pending.
  - artifact: call-for-control-of-frontier-ai-models-2026
    relationship: related
    note: >
      Carney signed a call for shared reporting of serious AI safety incidents
      among governments. Non-binding.
  - artifact: paris-call-ai-safety-security-declaration-2026
    relationship: related
    note: >
      Signatories commit to rapid alert systems and aligned incident
      classification for serious cyber and AI control incidents. Voluntary and
      non-binding.

title: "Canada opens applications to build a national AI supercomputer"
date: 2026-04-15
status: completed

location:
  name: "Ottawa, Ontario"
  schema_type: Place

organizations:
  - id: ised-canada
    role: organizer

description: >
  Evan Solomon, Minister of Artificial Intelligence and Digital Innovation,
  opens the call for applications under the AI Sovereign Compute
  Infrastructure Program (SCIP) — the public supercomputing pillar of the
  Canadian Sovereign AI Compute Strategy. Eligible Canadian not-for-profits,
  post-secondary institutions, and consortia they lead are invited to design,
  build, operate, and maintain a large-scale, AI-optimized, Canadian-owned and
  Canadian-operated high-performance computing system for Canadian researchers
  and innovators. Applications closed on 1 June 2026.


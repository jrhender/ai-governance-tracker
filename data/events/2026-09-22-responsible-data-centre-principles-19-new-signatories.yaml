description: >
  The Government of Canada announces that 19 more organizations have signed
  Canada's Responsible Data Centre Development Principles, nearly doubling
  support from 23 to 42 signatories less than three weeks after launch. New
  signatories include chipmakers AMD, Intel, and NVIDIA; IBM, Kyndryl, and
  Lenovo; data centre operators STACK Infrastructure, Vantage Data Centers,
  and Qu Data Centres; builder EllisDon; and energy firms including Energy
  Storage Canada, Enwave, and Schneider Electric.


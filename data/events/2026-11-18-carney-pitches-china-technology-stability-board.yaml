description: >
  Speaking to reporters in Shenzhen on the sidelines of the APEC meetings,
  Prime Minister Mark Carney says he pitched Chinese President Xi Jinping on a
  "Technology Stability Board": a global, non-binding body of countries with AI
  expertise that would monitor AI risks and, at a minimum, share lessons on AI
  incidents. It is modelled on the Financial Stability Board, which Carney
  chaired. Politico reports its structure and mandate are not finalized, that
  Canada is seeking China's buy-in, and that Carney says there "can't be a
  global solution without the countries that are developing the most advanced
  systems — including China." A readout from his office says he and Xi "agreed
  on the importance of strengthening cooperation on the global governance of
  artificial intelligence." Carney also calls the absence of global AI
  governance "an enormous risk" (economic, biohazard and to democracy). This is
  a proposal; no Chinese response was reported. The board name comes from
  Politico only; Euronews/AFP reports the call for "global governance
  frameworks" without naming a board.


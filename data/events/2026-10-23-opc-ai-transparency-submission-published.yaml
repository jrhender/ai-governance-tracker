title: "Privacy Commissioner publishes comments on ISED's AI transparency consultation"
date: 2026-10-23
status: completed

organizations:
  - id: opc-canada
    role: publisher

description: >
  The Office of the Privacy Commissioner of Canada publishes its submission to
  ISED's consultation on AI transparency. The OPC backs action across the five
  areas ISED identified (AI-generated content, AI interaction, information
  about AI systems, AI incidents, and AI agents), arguing that disclosures must
  be understandable and available when they matter to an individual's
  decisions.


# mitigations/skills-data-compute-investment.yaml

id: skills-data-compute-investment
schema_type: DefinedTerm
title: "Invest in skills, data, and compute"
description: >
  Invest in widespread skills development and broad access to data and
  computing power.
mitigation_type: operational-process
addresses_risks:
  - ai-power-concentration-dependence
status: under_review
implemented_by:
  - artifact: canadian-sovereign-ai-compute-strategy
    relationship: partially_implements
    note: >
      The $2B Canadian Sovereign AI Compute Strategy addresses the compute
      half of this recommendation — commercial data centres, a public AI
      supercomputer, and subsidized compute access for SMEs — but not the
      skills and data components.
  - event: ai-scip-call-for-applications-opened-2026
    relationship: partially_implements
    note: >
      Applications opened in April 2026 for a publicly owned national AI
      supercomputer, the strategy's public-compute pillar.
  - event: ai-compute-access-fund-first-recipients-2026
    relationship: partially_implements
    note: >
      The first 44 AI Compute Access Fund projects ($66 million of $300
      million) subsidize compute for Canadian SMEs.
  - event: national-ai-literacy-initiative-launched-2026
    relationship: partially_implements
    note: >
      A $13-million literacy partnership with Amii addresses the skills
      component for students, educators and the public.
  - event: bell-saskatchewan-ai-infrastructure-investment-2026
    relationship: related
    note: >
      The government welcomed a private sovereign AI infrastructure investment
      of up to $52.5 billion in Saskatchewan. It is not a federal program.
tags: [compute, ai-infrastructure]

title: "Carney signs the Call for Control of Frontier AI Models"
date: 2026-09-22

organizations:
  - id: pmo-canada
    role: participant

description: >
  Prime Minister Mark Carney signs "A Call for Control of Frontier AI Models,"
  a joint statement from 20 countries and the European Commission published by
  the Dutch government and launched at the UN General Assembly. It calls for
  mandatory pre-deployment testing and independent evaluation by developers,
  coordinated standards and shared incident reporting among governments, and
  an international institution able to set standards and verify compliance.
  It remains open to other leaders.


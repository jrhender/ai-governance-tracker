description: >
  Prime Minister Mark Carney addresses the European Parliament in Strasbourg
  and proposes deep Canada-EU cooperation on strategic capabilities, including
  AI and compute, critical minerals, defence and energy security. On AI, he
  says the two can pool new sovereign compute capacity and "join forces to
  develop AI safety protocols, coordinate common standards, and strengthen
  transparency." This is a stated proposal, not a signed agreement.


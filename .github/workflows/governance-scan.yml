# Scans curated sources each weekday for Canadian AI governance developments
# not yet in data/, and files them as issues for human review.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN is a Claude subscription token minted with
# `claude setup-token`. It is long-lived but NOT permanent — when it expires
# this workflow fails loudly and the fix is to re-mint it and update the secret.
# The claude-code CLI version below is pinned deliberately, since this
# workflow's correctness depends on specific permission-denial and
# result-schema behaviour — it needs periodic, deliberate bumping, not an
# automatic float to @latest.

name: Governance Scan

on:
  schedule:
    # 12:00 UTC = 08:00 Eastern in summer, 07:00 in winter. Weekdays only.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print candidate issues instead of filing them'
        type: boolean
        default: false
      probe_only:
        description: 'Only probe source reachability, do not scan (no quota cost)'
        type: boolean
        default: false
      lookback_days:
        description: 'How many days back to look (default 14; use a wider window for a one-off catch-up)'
        type: string
        default: ''
      max_issues:
        description: 'Max issues to file (default 5; raise for a one-off catch-up)'
        type: string
        default: ''

concurrency:
  group: governance-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fetch the sources ourselves rather than letting the agent do it. Plain
      # HTTP reaches canada.ca where the agent's WebFetch got 403, and doing it
      # here means coverage is MEASURED, not self-reported by the agent.
      - name: Fetch sources
        run: node scripts/governance-scan/fetch.mjs 2>&1 | tee fetch.txt

      # Gate on measured coverage before spending any quota. A scan that cannot
      # see most of its sources cannot be trusted to report NO_NEW_LEADS.
      - name: Check source coverage
        env:
          # 6 sources are confirmed good: legisinfo, ised-newsroom,
          # indu-committee, caisi, cifar, privacy-commissioner. aigs and cigi
          # are Cloudflare-blocked and will never fetch; pm-newsroom's html is
          # too thin and its feeds are unverified. A floor of 5 therefore
          # tolerates ONE transient failure while still failing loudly if two
          # or more of the good sources go dark.
          MIN_SOURCES_OK: '5'
        run: |
          node -e '
            const cov = require("./sources-cache/coverage.json");
            const ok = cov.filter((c) => c.ok);
            const bad = cov.filter((c) => !c.ok);
            const min = Number(process.env.MIN_SOURCES_OK || "5");
            console.log("Coverage: " + ok.length + "/" + cov.length + " sources fetched.");
            if (bad.length) {
              console.error("::warning::Unreachable: " + bad.map((c) => c.id + " (" + c.attempts.map((a) => a.error || a.status).join(",") + ")").join("; "));
            }
            if (ok.length < min) {
              console.error("::error::Only " + ok.length + " of " + cov.length + " sources were fetched (minimum " + min + "). Fix the source urls or lower MIN_SOURCES_OK deliberately.");
              process.exit(1);
            }
          '

      - name: Stop here if probing only
        if: ${{ inputs.probe_only }}
        run: echo "probe_only requested — sources fetched, skipping the scan."

      - if: ${{ !inputs.probe_only }}
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Scan for untracked developments
        if: ${{ !inputs.probe_only }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '' }}
          MAX_ISSUES: ${{ inputs.max_issues || '' }}
        run: |
          set -o pipefail
          claude -p "$(cat .github/prompts/governance-scan.md)"$'\n\nDRY_RUN='"$DRY_RUN" \
            --allowed-tools 'Bash(node scripts/governance-scan/context.mjs:*)' \
            --allowed-tools 'Bash(node scripts/governance-scan/filter.mjs:*)' \
            --allowed-tools 'Bash(gh issue create:*)' \
            --allowed-tools 'Read' \
            --allowed-tools 'WebSearch' \
            --max-turns 60 \
            --output-format json < /dev/null 2>scan.err | tee scan.json

          node -e '
            const fs = require("fs");
            let raw;
            try {
              raw = fs.readFileSync("scan.json", "utf8");
            } catch (e) {
              console.error("::error::Could not read scan.json: " + e.message);
              process.exit(1);
            }
            let j;
            try {
              j = JSON.parse(raw);
            } catch (e) {
              console.error("::error::scan.json is not valid JSON, the scan may have crashed or been interrupted: " + e.message);
              process.exit(1);
            }

            // Every denial is a warning now, not a failure. Blindness is caught
            // deterministically by the coverage gate BEFORE the agent runs, so a
            // denial here only means the agent reached for a tool it was told not
            // to use — the content it needed was already on disk.
            const denials = j.permission_denials || [];
            if (denials.length) {
              const describe = (x) => x.tool_name + " " + ((x.tool_input && (x.tool_input.url || x.tool_input.command)) || "");
              console.error("::warning::Scan hit " + denials.length + " permission denial(s): " + denials.map(describe).join(", "));
            }

            if (j.subtype === "error_max_turns") {
              console.error("::error::Scan hit the --max-turns limit before finishing (subtype=error_max_turns), results may be incomplete.");
              process.exit(1);
            }
            if (j.is_error || (j.subtype && j.subtype.startsWith("error"))) {
              console.error("::error::Scan ended in an error state (subtype=" + j.subtype + ", is_error=" + j.is_error + ").");
              process.exit(1);
            }

            console.log(j.result || "");
          '

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-scan-log
          path: |
            scan.json
            scan.err
            fetch.txt
            sources-cache/

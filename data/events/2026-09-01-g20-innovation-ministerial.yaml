description: >
  Parliamentary Secretary Karim Bardeesy attends the G20 Innovation Ministerial
  on September 1-2 on behalf of Industry Minister Mélanie Joly and AI and
  Digital Innovation Minister Evan Solomon. Discussions cover innovation
  policy, public sector AI adoption, technical workforce development,
  intellectual property, standards for AI, and industrial supply chains. On the
  margins, Bardeesy meets representatives of Mexico, the United Kingdom,
  Australia and the European Union on science, technology, AI and innovation
  collaboration, and sets out Canada's view of AI's role in innovation to the
  American hosts. ISED announced Canada's participation on September 3, 2026.


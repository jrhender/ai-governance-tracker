id: international-ai-verification-agreement
schema_type: DefinedTerm
title: "International \"trust but verify\" agreement on frontier AI"
description: >
  A treaty-style agreement among states that limits frontier AI development
  (up to prohibiting superintelligence) and backs the limits with technical
  verification, so that parties can check each other's compliance rather than
  rely on assertions. Modelled on nuclear arms-control verification.

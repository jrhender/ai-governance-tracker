provisions:
  - id: deepfake-impersonation-offence
    title: "Impersonation offence covers realistic deepfakes of electoral actors"
    summary: >
      Extend the section 480.1 impersonation offence to false representations
      made by technological means — a manipulated or synthesised image, voice
      imitation, or audio recording likely to be mistaken for an electoral actor
      — where it is made or distributed with intent to mislead.
  - id: electoral-actors-protected
    title: "Scope of protected electoral actors"
    summary: >
      Protect the Chief Electoral Officer and Elections Canada staff, election
      officers, leaders of registered and eligible parties, candidates and
      prospective candidates, and nomination and leadership contestants.
  - id: parody-satire-defence
    title: "Parody and satire defence"
    summary: >
      Provide a defence where the accused establishes that the image, imitation,
      audio recording, or representation was manifestly for the purpose of
      parody or satire.
  - id: nomination-leadership-contest-deepfakes
    title: "Equivalent protections for nomination and leadership contests"
    summary: >
      Apply the deepfake, bribery, intimidation, foreign-influence, and
      computer-misuse protections to nomination and leadership contests, inside
      and outside Canada.
  - id: election-disinformation-offence
    title: "Election disinformation offence"
    summary: >
      Make it an offence to knowingly spread false information about the voting
      process or election activities in order to disrupt an election, with
      carve-outs for good-faith opinion and satire.
  - id: extended-application
    title: "Application outside election periods and outside Canada"
    summary: >
      Extend the impersonation, disinformation, and computer-misuse offences so
      they apply at all times rather than only during an election period, and to
      conduct occurring outside Canada.


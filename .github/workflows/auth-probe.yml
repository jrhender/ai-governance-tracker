# THROWAWAY probe — verifies CLAUDE_CODE_OAUTH_TOKEN works on an Actions
# runner before we build the governance scanner against it.
# Delete this file and its branch once the answer is known.

name: Auth Probe

on:
  push:
    branches: [chore/actions-auth-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      # The job's PASS/FAIL is the result signal: Actions logs aren't
      # readable from the dev sandbox, but the check conclusion is.
      - name: Probe subscription auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          claude -p 'Reply with exactly: AUTH_PROBE_OK' 2>&1 | tee out.txt
          grep -q 'AUTH_PROBE_OK' out.txt

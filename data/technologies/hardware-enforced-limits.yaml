id: hardware-enforced-limits
schema_type: DefinedTerm
title: "Hardware-enforced limits"
also_known_as: []
domain: verification
summary: >
  Some verification systems aim to verify an agreement by directly enforcing
  it. A scheme meant to slow large-scale frontier training runs could, for
  example, remove the high-bandwidth network between chips.
example_claim: "This compute cannot perform pre-training efficiently."
why_it_matters: >
  Increases the friction of running workloads that are not allowed.

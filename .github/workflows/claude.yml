name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Claude's whole tool grant surface comes from this step, because the
      # action grants no Bash at all by default: WebFetch per governance-scan
      # source host (.github/sources.yaml), a plain-HTTP wrapper for when
      # WebFetch is refused (canada.ca has 403'd it), and the package scripts
      # needed to build and test a change before pushing it. The wrapper and its
      # host list are staged under runner.temp because the action auto-approves
      # Claude's edits inside the workspace, and they must not be editable.
      - name: Stage web access and build grants
        id: web
        run: node scripts/fetch-url/stage.mjs "${{ runner.temp }}/fetch-url" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          # Paths come from step outputs, not $RUNNER_TEMP: the action parses
          # claude_args without an environment, so $VARS would expand to "".
          claude_args: |
            --allowedTools "${{ steps.web.outputs.allowed_tools }}"
            --append-system-prompt 'Web access is limited to the governance scan source sites in .github/sources.yaml. Use WebFetch for those sites. If WebFetch fails (canada.ca often returns 403 to it), run: ${{ steps.web.outputs.fetch_command }} <url> which does a plain GET to the same sites and prints the page text. curl and other network commands are not available. Dependencies are already installed, so verify your work before pushing: pnpm test for the unit suite and pnpm build for the site. Run pnpm exec playwright install --with-deps chromium before pnpm test:e2e, as no browser is installed up front. Report any suite you did not run.'


title: "Prime Minister Carney launches the National Council on Artificial Intelligence"
date: 2026-10-02
status: completed

description: >
  Prime Minister Mark Carney launches a new 13-member National Council on
  Artificial Intelligence, bringing together academics and private-sector
  leaders — including Yoshua Bengio, Valerie Pisano and Michelle Zatlyn — to
  advise the government on the evolution of its AI for All strategy, covering
  AI adoption, sovereign AI infrastructure, safety, and democratic
  protections.


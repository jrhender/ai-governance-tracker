description: >
  At Amii's headquarters in Edmonton, Evan Solomon, Minister of Artificial
  Intelligence and Digital Innovation, launches the National AI Literacy
  Initiative — a $13-million national partnership with the Alberta Machine
  Intelligence Institute delivering the AI for All commitment to build AI
  literacy. Free courses run in three streams — Essentials for Students,
  Essentials for Educators, and Essentials for Canadians — targeting up to one
  million post-secondary students and more than 50,000 K-12 educators. From
  21 September 2026 post-secondary institutions can join the consortium and
  the first Educators chapter opens, with five more chapters through the fall.


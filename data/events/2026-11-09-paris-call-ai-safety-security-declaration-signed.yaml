title: "Canada signs Joint Declaration on the Paris Call for AI Safety and Security"
date: 2026-11-09

organizations:
  - id: pmo-canada
    role: participant
  - id: lawzero
    role: participant

description: >
  Canada, Bahrain, Finland, France, Norway and the Netherlands sign a joint
  declaration with ten AI companies (including Anthropic, Cohere, OpenAI and
  Mistral AI) and four civil-society groups (including LawZero). It commits
  them to common frontier-model evaluation, developer accountability, and
  incident reporting and early-warning systems. The declaration remains open
  to new endorsements.


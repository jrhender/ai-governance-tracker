description: >
  In Toronto, Evan Solomon, Minister of Artificial Intelligence and Digital
  Innovation, joined by Federation of Canadian Municipalities President Tim
  Tierney, launches Canada's Responsible Data Centre Development Principles —
  a national framework setting five expectations for data centre projects:
  lasting local benefits, electricity costs, water use and environmental
  impacts, transparency, and strategic value to Canada. Backed by 23 industry
  signatories, it sets a nationally recognized baseline alongside provincial,
  territorial, municipal, and Indigenous regulatory processes.


title: "Bill C-25 (Strong and Free Elections Act) introduced in the House of Commons (first reading)"
date: 2026-03-26
status: completed

description: >
  The Strong and Free Elections Act (Bill C-25) is introduced and receives first
  reading in the House of Commons, tabled by Steven MacKinnon, Leader of the
  Government in the House of Commons. The bill is tracked here for its extension
  of the Canada Elections Act impersonation offence to realistic deepfakes of
  electoral actors — manipulated images, voices, or recordings likely to be
  mistaken for the Chief Electoral Officer, election officers, party leaders,
  candidates, or contestants — with a defence for parody and satire.


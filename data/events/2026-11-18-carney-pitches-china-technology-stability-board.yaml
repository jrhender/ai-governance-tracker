description: >
  Speaking to reporters in Shenzhen at the APEC meetings, Prime Minister Mark
  Carney says he pitched Xi Jinping on a "Technology Stability Board": a
  non-binding global body of AI-expert countries that would monitor AI risks
  and share lessons on incidents, modelled on the Financial Stability Board.
  He says there "can't be a global solution" without China. His office's
  readout says he and Xi agreed on the importance of cooperation on AI
  governance. A proposal only; no Chinese response reported. The board name is
  from Politico; Euronews/AFP cites only "global governance frameworks".


title: "ISED opens public consultation on advancing AI transparency"
date: 2026-07-23
status: completed

organizations:
  - id: ised-canada
    role: organizer

description: >
  ISED opens a public consultation, running July 23 to September 23, 2026, on
  increasing AI transparency under the AI for All national strategy. Its
  discussion paper, "Enhancing trust in artificial intelligence through
  increased transparency," seeks views on five areas: AI-generated content,
  knowing when one is interacting with AI, information about AI systems,
  tracking serious AI incidents, and tracking the activity of AI agents. ISED
  plans to publish a What We Heard report.


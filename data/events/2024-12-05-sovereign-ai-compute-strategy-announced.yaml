  - id: ised-canada
    role: organizer

description: >
  In Ottawa, François-Philippe Champagne, Minister of Innovation, Science and
  Industry, announces the Canadian Sovereign AI Compute Strategy, setting out
  how the $2 billion from Budget 2024 will be spent on domestic AI computing
  capacity: up to $700 million to co-invest in commercial AI data centres
  through an AI Compute Challenge, up to $1 billion for public computing
  infrastructure including a new publicly owned AI supercomputer, and up to
  $300 million to subsidize compute access for small and medium-sized
  enterprises. Cohere is named the first recipient, offered up to
  $240 million toward a $725-million Canadian data centre.


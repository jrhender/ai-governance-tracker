description: >
  Canada's federal, provincial and territorial privacy and information
  commissioners and ombuds meet in Ottawa for their annual meeting, hosted by
  Privacy Commissioner Philippe Dufresne and Information Commissioner Caroline
  Maynard. Privacy discussions focus on the opportunities and risks of
  emerging technologies, including AI, quantum computing and advanced
  data-processing systems, and how privacy intersects with cross-border data
  flows, digital sovereignty and national resilience. On access to
  information, participants explore how new technologies are changing how
  government records are created and managed, and what that means for access
  rights.


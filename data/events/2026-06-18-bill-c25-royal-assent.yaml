title: "Bill C-25 (Strong and Free Elections Act) receives royal assent"
date: 2026-06-18
status: completed

description: >
  Bill C-25, the Strong and Free Elections Act, receives royal assent and is
  enacted as Statutes of Canada 2026, c. 20. The Canada Elections Act
  impersonation offence now expressly covers realistic deepfakes of electoral
  actors made or distributed with intent to mislead, subject to a parody and
  satire defence. AI-generated political content that does not imitate a real
  electoral actor remains outside the Act, and there is no labelling requirement
  for synthetic election material.


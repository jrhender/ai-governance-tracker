# Sources walked by .github/workflows/governance-scan.yml each weekday.
# Tuning this list is the main lever on signal quality — add sources that
# have produced real leads, remove ones that only produce noise.
#
# `feeds:` is an optional ordered list of machine-readable feeds for the same
# source. The workflow fetches these itself (scripts/governance-scan/fetch.mjs)
# and tries each in order, falling back to `url` last — first success wins.
#
# Verified by a probe run on a GitHub runner (2026-08-24):
#   reachable  legisinfo, ised-newsroom, indu-committee, caisi, cifar
#   blocked    aigs, cigi — Cloudflare 403 on both page and feed, so nothing
#              fetches them; the agent uses WebSearch for these instead.

sources:
  - id: legisinfo
    name: LEGISinfo — bills before Parliament
    url: https://www.parl.ca/legisinfo/en/bills
    look_for: AI, algorithmic, online harms, privacy, or data bills

  - id: ised-newsroom
    name: ISED news releases
    url: https://www.canada.ca/en/innovation-science-economic-development/news.html
    look_for: AI strategy, funding, codes of practice, ministerial announcements
    feeds:
      # dept slugs use the department's legal name; ISED is the Department of
      # Industry. Candidate — falls back to the page url, which probes OK.
      # `{since}` expands to the lookback start date, so a wide LOOKBACK_DAYS
      # genuinely reaches further back. Without it the feed returns only its
      # most recent items — a 180-day catch-up run still missed a May
      # announcement sitting outside a pick=25 window.
      - https://api.io.canada.ca/io-server/gc/news/en/v2?dept=departmentofindustry&sort=publishedDate&orderBy=desc&publishedDate>={since}&pick=500&format=atom

  - id: indu-committee
    name: INDU — Standing Committee on Industry and Technology
    url: https://www.ourcommons.ca/Committees/en/INDU/Meetings
    look_for: meetings and reports touching AI

  - id: caisi
    name: Canadian AI Safety Institute
    url: https://ised-isde.canada.ca/site/ised/en/canadian-artificial-intelligence-safety-institute
    look_for: publications, research notes, mandate changes

  - id: aigs
    name: AI Governance & Safety Canada
    url: https://aigs.ca/
    look_for: reports, briefs, campaigns
    # Cloudflare 403s both the page and /feed/ — WebSearch only.

  - id: cigi
    name: Centre for International Governance Innovation
    url: https://www.cigionline.org/topics/artificial-intelligence/
    look_for: AI governance reports and policy briefs
    # Cloudflare 403s both the page and /rss.xml — WebSearch only.

  - id: cifar
    name: CIFAR — Pan-Canadian AI Strategy
    url: https://cifar.ca/ai/
    look_for: strategy phases, funding, national AI institute news
    feeds:
      - https://cifar.ca/feed/  # verified reachable

  - id: privacy-commissioner
    name: Office of the Privacy Commissioner of Canada — news
    # KNOWN LIMIT: the html index carries only ~10 items (oldest was 2026-06-26
    # on a 2026-08-30 run), so anything older is invisible here — that is why a
    # 180-day catch-up missed the May and June AI investigations. Two RSS paths
    # were tried and both returned 404: /en/opc-news/news-and-announcements/rss/
    # and /rss/news-and-announcements-eng.xml. Do not re-guess blindly; find the
    # real feed url from the site's RSS page before adding one.
    url: https://www.priv.gc.ca/en/opc-news/news-and-announcements/
    look_for: investigations, findings and guidance touching AI or automated decision-making

# REMOVED: pm-newsroom (https://www.pm.gc.ca/en/news/news-releases). Its html
# index is JS-rendered and yields ~1000 chars of stripped text, and three feed
# candidates were tried across two runs — dept=pmo (136 chars),
# dept=primeministersoffice (136 chars) and /news-releases.rss (same thin html).
# All failed the content threshold. WebSearch covers pm.gc.ca instead.
